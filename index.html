<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎉 Tanti Auguri di Compleanno! 🎉</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="confetti-container"></div>

    <div class="envelope-scene">
        <h1 class="message-text">Apri la Busta...</h1>
        <div class="envelope-wrapper">
            <div class="envelope-body"></div>
            
            <div class="envelope-back-flap"></div>
            
            <div class="envelope-card">
                <img src="biglietto.jpg" alt="Biglietto di Auguri">
            </div>

            <div class="envelope-top-flap"></div>
        </div>
        <p class="signature-text">Con affetto ❤️</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
